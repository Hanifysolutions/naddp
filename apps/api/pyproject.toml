[project]
name = "naddp-api"
version = "0.1.0"
description = "NADDP — Nigeria–Australia Digital Diplomacy Platform: Ambassador demo API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
authors = [{ name = "NADDP Demo Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.35",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4,<1",
    "python-ulid>=2.7,<5",
    "itsdangerous>=2.2",
    "structlog>=24.4",
    "anthropic>=1.4,<2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
# `package = false` makes this a *virtual* project: uv creates `.venv` and
# installs the dependencies, but does NOT build/install `naddp-api` itself.
# The API is a deployed application, not a distributable library, so there is
# no build backend and no editable install to keep in sync.
#
# `app` stays importable because every entry point puts `apps/api` on sys.path:
#   * uvicorn  -> `--app-dir` defaults to "." (run from apps/api)
#   * pytest   -> [tool.pytest.ini_options] pythonpath = ["."]
#   * alembic  -> alembic.ini `prepend_sys_path = .`
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "alembic/versions/*.pyc"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "C4",    # flake8-comprehensions
    "PTH",   # flake8-use-pathlib
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use obviously-fake secrets, and need not be annotated.
"tests/*" = ["S101", "S105", "S106", "ANN"]
# Alembic env/templates and generated migrations are machine-shaped code.
"alembic/*" = ["ANN", "E501", "ERA001", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are call-in-default by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["pgvector.*", "ulid.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Alembic migration scripts are generated; do not hold them to strict rules.
module = ["alembic.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live database (docker compose up db)",
]
# Zero warnings is a gate, so the one tolerated warning is named exactly. starlette 1.6.0's
# own testclient.py still spells `anyio.abc.BlockingPortal`, an alias anyio 4.15 deprecated.
# It is raised inside site-packages at import, not by this codebase, and nothing here can
# fix it short of pinning a different starlette or anyio. Matched on the full message so any
# other DeprecationWarning -- including a future one from starlette -- still surfaces.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
