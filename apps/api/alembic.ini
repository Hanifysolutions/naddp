# Alembic configuration for the NADDP API.
#
# NOTE: sqlalchemy.url is intentionally EMPTY. alembic/env.py supplies the URL
# from app.core.config.get_settings().database_url so there is exactly one
# source of truth for the connection string and no credentials live in git.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# UTC timestamps in generated filenames. On Windows this needs the `tzdata`
# package, which psycopg already depends on (sys_platform == 'win32').
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
